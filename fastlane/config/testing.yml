# =============================================================================
# EMAIL NOTIFICATIONS
# =============================================================================

notifications:
  email:
    enabled: true

    notify_on_success: true
    notify_on_failure: true

    # SMTP credentials MUST come from environment variables.
    # Never commit SMTP credentials to this file.
    #
    # Required environment variables:
    # SMTP_HOST
    # SMTP_PORT
    # SMTP_USERNAME
    # SMTP_PASSWORD
    # SMTP_FROM
    # TEST_ALERT_EMAIL_RECIPIENTS

    recipients: "${TEST_ALERT_EMAIL_RECIPIENTS}"