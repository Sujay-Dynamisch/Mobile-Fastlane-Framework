# =============================================================================
# Firebase App Testing Agent - Test Device Configuration
# =============================================================================
#
# IMPORTANT:
# - Only the 10 devices marked as ENABLED below will run by default.
# - All other devices are intentionally commented out.
# - To enable another device, uncomment its complete block.
# - `model` must be the Firebase Test Lab MODEL_ID, not the marketing name.
# - `version` is the Android API level.
# - `orientation` can be portrait or landscape.
#
# Firebase device catalog:
# gcloud firebase test android models list
#
# =============================================================================

app_testing:
  enabled: true
  blocking: true

# =============================================================================
# ENABLED DEVICES
# =============================================================================
# Exactly 10 devices are enabled by default.
# Developer can enable/disable devices by uncommenting/commenting blocks below.
# =============================================================================

test_devices:

  # ---------------------------------------------------------------------------
  # 1. Galaxy A54 5G - API 34 - Portrait
  # ---------------------------------------------------------------------------
  - model: "a54x"
    version: "34"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 2. Galaxy A54 5G - API 34 - Landscape
  # ---------------------------------------------------------------------------
  - model: "a54x"
    version: "34"
    locale: "en"
    orientation: "landscape"

  # ---------------------------------------------------------------------------
  # 3. Galaxy S21 5G - API 34
  # ---------------------------------------------------------------------------
  - model: "o1q"
    version: "34"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 4. Galaxy S25 Ultra - API 35
  # ---------------------------------------------------------------------------
  - model: "pa3q"
    version: "35"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 5. OnePlus Nord CE 3 Lite 5G - API 34
  # ---------------------------------------------------------------------------
  - model: "OP5958L1"
    version: "34"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 6. OPPO A79 5G - API 34
  # ---------------------------------------------------------------------------
  - model: "OP573DL1"
    version: "34"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 7. Pixel 6 - API 33
  # ---------------------------------------------------------------------------
  - model: "oriole"
    version: "33"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 8. Pixel 9 - API 36
  # ---------------------------------------------------------------------------
  - model: "tokay"
    version: "36"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 9. Lenovo Tab P12 - API 35
  # ---------------------------------------------------------------------------
  - model: "TB370FU"
    version: "35"
    locale: "en"
    orientation: "portrait"

  # ---------------------------------------------------------------------------
  # 10. Medium Phone - API 30
  # ---------------------------------------------------------------------------
  - model: "MediumPhone.arm"
    version: "30"
    locale: "en"
    orientation: "portrait"


