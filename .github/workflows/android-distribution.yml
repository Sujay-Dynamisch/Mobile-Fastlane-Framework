name: Android Distribution

# Runs automatically ONLY when a pull request into `main` is merged.
#   - Opening / updating a PR            → does not run
#   - Closing a PR without merging       → does not run
#   - Direct push to main (no PR)        → does not run (protect `main` so changes go through PRs)
# "Run workflow" (manual) stays available to distribute any environment on demand.
#
# Environment for merged PRs: repository variable ANDROID_AUTO_ENVIRONMENT
# (Settings → Secrets and variables → Actions → Variables). Defaults to "development".

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/ios-distribution.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Distribution environment
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - uat
          - production

# One Android distribution at a time per environment; never cancel a running upload.
concurrency:
  group: android-distribution-${{ inputs.environment || vars.ANDROID_AUTO_ENVIRONMENT || 'development' }}
  cancel-in-progress: false

jobs:
  distribute:
    # pull_request "closed" also fires for PRs closed without merging — skip those.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Setup + build ≈ 15 min, two Firebase uploads, and the blocking App Testing agent
    # waits up to 20 min for results; 90 min leaves headroom for slow runners.
    timeout-minutes: 90

    permissions:
      contents: read

    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      DISTRIBUTION_ENV: ${{ inputs.environment || vars.ANDROID_AUTO_ENVIRONMENT || 'development' }}
      # On a merged PR GitHub's ref is "<number>/merge"; fastlane's production guard and the
      # Teams card use these instead.
      DISTRIBUTION_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
      DISTRIBUTION_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      # Release notes for merged PRs: "PR #12: Add follow-up module". Manual runs use git history.
      # Quoted: an unquoted " #" would start a YAML comment and cut the expression.
      RELEASE_NOTES: "${{ github.event.pull_request && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}"
      VERSION_NAME: ${{ vars.VERSION_NAME }}

      # Firebase App Distribution
      FIREBASE_ANDROID_DEV_APP_ID: ${{ secrets.FIREBASE_ANDROID_DEV_APP_ID }}
      FIREBASE_ANDROID_DEV_GROUPS: ${{ secrets.FIREBASE_ANDROID_DEV_GROUPS }}
      FIREBASE_ANDROID_STAGING_APP_ID: ${{ secrets.FIREBASE_ANDROID_STAGING_APP_ID }}
      FIREBASE_ANDROID_STAGING_GROUPS: ${{ secrets.FIREBASE_ANDROID_STAGING_GROUPS }}
      FIREBASE_ANDROID_UAT_APP_ID: ${{ secrets.FIREBASE_ANDROID_UAT_APP_ID }}
      FIREBASE_ANDROID_UAT_GROUPS: ${{ secrets.FIREBASE_ANDROID_UAT_GROUPS }}
      FIREBASE_ANDROID_PROD_APP_ID: ${{ secrets.FIREBASE_ANDROID_PROD_APP_ID }}
      FIREBASE_ANDROID_PROD_GROUPS: ${{ secrets.FIREBASE_ANDROID_PROD_GROUPS }}
      # User token from `firebase login:ci` (required for the App Testing agent; service accounts get 403)
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_TEST_USERNAME: ${{ secrets.FIREBASE_TEST_USERNAME }}
      FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}

      # Notifications (optional — skipped with a warning when not set)
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      TEST_ALERT_EMAIL_RECIPIENTS: ${{ secrets.TEST_ALERT_EMAIL_RECIPIENTS }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DISTRIBUTION_COMMIT }}
          fetch-depth: 50 # git-based release notes need recent history

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Ruby (version from .ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22" # package.json engines: >= 22.11.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Safety net: the Gradle wrapper loses its executable bit when committed from Windows.
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Sign with the Play upload key (same signature as Play builds) when its secrets exist;
      # otherwise android/app/build.gradle falls back to the debug key with a warning.
      - name: Write Play upload keystore (only if provided)
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_UPLOAD_KEYSTORE_BASE64 not set — release APK will be signed with the debug key."
            exit 0
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          {
            echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore"
            echo "ANDROID_UPLOAD_STORE_PASSWORD=$ANDROID_UPLOAD_STORE_PASSWORD"
            echo "ANDROID_UPLOAD_KEY_ALIAS=$ANDROID_UPLOAD_KEY_ALIAS"
            echo "ANDROID_UPLOAD_KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Write Firebase service account (only if provided)
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "FIREBASE_SERVICE_CREDENTIALS_FILE=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          elif [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Set the FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_JSON repository secret."
            exit 1
          fi

      - name: Run summary
        shell: bash
        run: |
          {
            echo "### Android distribution"
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | ${{ github.event_name == 'workflow_dispatch' && 'Manual run' || format('Merged PR #{0}', github.event.pull_request.number) }} |"
            echo "| Environment | \`$DISTRIBUTION_ENV\` |"
            echo "| Branch | \`$DISTRIBUTION_BRANCH\` |"
            echo "| Commit | \`${DISTRIBUTION_COMMIT:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Fastlane configuration
        run: bundle exec fastlane android doctor environment:${{ env.DISTRIBUTION_ENV }}

      - name: Build and distribute
        shell: bash
        run: |
          set -o pipefail
          bundle exec fastlane android distribute environment:${{ env.DISTRIBUTION_ENV }} 2>&1 | tee "$RUNNER_TEMP/fastlane-android.log"

      # Gradle prints the real cause in "* What went wrong:" far above the end of a long log.
      # Surface it in the job summary + annotations, and keep the full log as an artifact.
      - name: Show build failure reason
        if: failure()
        shell: bash
        run: |
          # GitHub runs bash with -e -o pipefail; `head` closing the pipe early must not fail this step.
          set +e +o pipefail
          LOG="$RUNNER_TEMP/fastlane-android.log"
          [ -f "$LOG" ] || exit 0
          REASON=$(sed 's/\x1b\[[0-9;]*m//g' "$LOG" | grep -A 25 -m 3 -E '\* What went wrong:|error: |e: file:|ERROR:' | head -80)
          {
            echo "### ❌ Android build failed — reason"
            echo '```'
            echo "${REASON:-No Gradle error block found; see the full log artifact.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$REASON" | head -15 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/fastlane-android.log
          retention-days: 7

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.DISTRIBUTION_ENV }}-${{ github.run_number }}
          path: dist/**/*.apk
          if-no-files-found: ignore
          retention-days: 14
